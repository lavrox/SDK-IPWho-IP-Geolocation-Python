[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipwho-ip-geolocation-api"
version = "2.0.0"
description = "Official Python SDK for the IPWho IP geolocation API (lookup, me, bulk) — geoip, IP location, ASN/ISP, timezone, VPN detection."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "IPWho SDK Contributors", email = "info@ipwho.org"}
]
keywords = [
    "ipwho",
    "ipwho.org",
    "lavrox",
    "geoip",
    "geoip lookup",
    "geoip api",
    "ip location",
    "ip location api",
    "ip lookup",
    "ip-geolocation",
    "ip geolocation",
    "ip-geolocation-api",
    "geolocation-api",
    "ip-api",
    "ipv4",
    "ipv6",
    "asn",
    "isp",
    "vpn-detection",
    "tor-detection",
    "proxy-detection",
    "timezone",
    "python",
    "sdk",
    "bulk ip lookup",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://www.ipwho.org"
Documentation = "https://www.ipwho.org/docs"
Repository = "https://github.com/lavrox/SDK-IPWho-Python.git"
"Bug Tracker" = "https://github.com/lavrox/SDK-IPWho-Python/issues"

[tool.setuptools.packages.find]
include = ["ipwho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
